# Mantiene los datos al día sin que nadie tenga que acordarse.
#
# Todos los días a las 06:00 de Cuenca revisa las fuentes que cambian seguido
# (basura, luz, farmacias, tranvía y avisos de agua); los lunes, todas. Pasa las pruebas con los
# datos nuevos y, solo si algo cambió y las pruebas pasan, los publica en main.
# Si una fuente falla, publica el resto y la ejecución queda en rojo: GitHub
# avisa por correo y en datos/estado.json queda el error.
#
# Si la prensa anuncia un corte de agua en Cuenca, abre un aviso (issue) para que
# una persona lo lea y, si es real, lo copie a datos/manual/agua.json.
#
# Y revisa lo que se está quedando viejo (farmacias que se acaban, avisos que
# vencen, datos a mano sin revisar, fuentes que fallan) en un aviso que se
# actualiza cada día y se cierra solo cuando todo está al día.
name: Actualizar datos

on:
  schedule:
    - cron: "0 11 * * *" # 06:00 en Cuenca (UTC-5): fuentes que cambian seguido
    - cron: "30 11 * * 1" # lunes 06:30: todas las fuentes
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes separadas por espacios (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Elegir fuentes
        id: plan
        env:
          PROGRAMA: ${{ github.event.schedule }}
          PEDIDAS: ${{ inputs.fuentes }}
        run: |
          if [ "$PROGRAMA" = "0 11 * * *" ]; then
            echo "fuentes=recoleccion luz farmacias tranvia agua" >> "$GITHUB_OUTPUT"
            echo "siempre=" >> "$GITHUB_OUTPUT"
          elif [ "$PROGRAMA" = "30 11 * * 1" ]; then
            echo "fuentes=" >> "$GITHUB_OUTPUT"
            echo "siempre=--siempre" >> "$GITHUB_OUTPUT"
          else
            echo "fuentes=$PEDIDAS" >> "$GITHUB_OUTPUT"
            echo "siempre=" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar las fuentes
        id: descargar
        env:
          FUENTES: ${{ steps.plan.outputs.fuentes }}
        run: |
          # Un fallo en una fuente no detiene las demás; se informa al final.
          if morlaco actualizar $FUENTES; then
            echo "fallo=no" >> "$GITHUB_OUTPUT"
          else
            echo "fallo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Probar con los datos nuevos
        run: |
          python -m pytest -q
          node --test "tests/web/*.test.mjs"

      - name: Publicar si algo cambió
        env:
          SIEMPRE: ${{ steps.plan.outputs.siempre }}
        run: |
          publicar=$(morlaco cambios $SIEMPRE --mensaje "$RUNNER_TEMP/mensaje.txt")
          echo "¿Publicar? $publicar"
          if [ "$publicar" != "si" ]; then
            exit 0
          fi
          cat "$RUNNER_TEMP/mensaje.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos web/info sitemap.xml
          git commit -q -F "$RUNNER_TEMP/mensaje.txt"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Avisar de cortes de agua por revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          morlaco avisos-agua > "$RUNNER_TEMP/agua.jsonl"
          if [ ! -s "$RUNNER_TEMP/agua.jsonl" ]; then
            echo "Ningún corte de agua por revisar."
            exit 0
          fi
          gh label create corte-agua --color 1f4a96 --description "Corte de agua por revisar" --force
          gh issue list --label corte-agua --state all --limit 200 --json body --jq '.[].body' > "$RUNNER_TEMP/abiertos.txt"
          python - <<'EOF'
          import json, os, subprocess
          tmp = os.environ["RUNNER_TEMP"]
          abiertos = open(f"{tmp}/abiertos.txt", encoding="utf-8").read()
          for linea in open(f"{tmp}/agua.jsonl", encoding="utf-8"):
              aviso = json.loads(linea)
              if aviso["enlace"] in abiertos:
                  continue
              cuerpo = (
                  f"El Mercurio publicó el {aviso['publicado']} una nota que parece anunciar un corte de agua:\n\n"
                  f"**{aviso['titulo']}**\n\n{aviso['resumen']}\n\n{aviso['enlace']}\n\n"
                  "Para publicarlo, lee la nota y copia el corte (fecha, horario, sectores y fuente) a "
                  "`datos/manual/agua.json`. Si no es un corte de ETAPA en Cuenca, añade el enlace a "
                  "`descartados`. Luego cierra este aviso."
              )
              subprocess.run(
                  ["gh", "issue", "create", "--label", "corte-agua",
                   "--title", f"Corte de agua por revisar: {aviso['titulo']}"[:250], "--body", cuerpo],
                  check=True,
              )
          EOF

      - name: Revisar lo que se queda viejo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          morlaco revisar > "$RUNNER_TEMP/revision.md"
          gh label create revisar-datos --color b97a12 --description "Datos que se quedan viejos" --force
          abierto=$(gh issue list --label revisar-datos --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -s "$RUNNER_TEMP/revision.md" ]; then
            cat "$RUNNER_TEMP/revision.md"
            if [ -n "$abierto" ]; then
              gh issue edit "$abierto" --body-file "$RUNNER_TEMP/revision.md"
            else
              gh issue create --label revisar-datos --title "Datos por revisar" --body-file "$RUNNER_TEMP/revision.md"
            fi
          elif [ -n "$abierto" ]; then
            gh issue close "$abierto" --comment "Todo está al día."
          else
            echo "Todo está al día."
          fi

      - name: Avisar si alguna fuente falló
        if: steps.descargar.outputs.fallo == 'si'
        run: |
          python - <<'EOF'
          import json
          estado = json.load(open("datos/estado.json", encoding="utf-8"))
          for nombre, e in estado.items():
              if not e.get("ok"):
                  print(f"::error title=Falló {nombre}::{e.get('error')}")
          EOF
          exit 1
