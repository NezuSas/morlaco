[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morlaco"
version = "0.1.0"
description = "Datos abiertos de servicios públicos de Cuenca, Ecuador: recolección de basura, cortes de luz y buses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# PyMuPDF 2 extrae el texto de las tablas de otra forma (Centro Sur, ARCSA) y pyshp 3 es una serie nueva sin probar:
# se fija la serie probada para que la actualización automática lea igual que en local.
dependencies = ["pymupdf>=1.24,<2", "pyshp>=2.3,<3"]

[project.optional-dependencies]
# pytest 9.2 falla al arrancar en Python 3.10.0; se fija la serie 8.
dev = ["pytest>=8,<9", "ruff>=0.5"]

[project.scripts]
morlaco = "morlaco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Filas de ejemplo copiadas de las tablas de ARCSA: se dejan en una línea para que se lean como la tabla.
"tests/test_farmacias.py" = ["E501"]
# El catálogo es texto para personas: cada descripción va en su línea, como se lee.
"src/morlaco/catalogo.py" = ["E501"]
# Filas de ejemplo copiadas de los CSV del portal, en una línea como en el archivo.
"tests/test_cerca.py" = ["E501"]
